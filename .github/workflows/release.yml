name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Universal App
        run: |
          ./scripts/build-app.sh
          cd .build
          zip -r -y "CursorPulse-${{ github.ref_name }}-macOS-universal.zip" CursorPulse.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/CursorPulse-${{ github.ref_name }}-macOS-universal.zip
          generate_release_notes: true
